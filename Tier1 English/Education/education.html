<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><title>Education Page</title></head>
<body>
    <button id="loginBtn" class="btn-secondary">Sign In</button>
    <input type="text" id="courseInput" placeholder="Course">
    <button id="startBtn" class="btn-primary">Start Lesson</button>
    <button id="submitAssignBtn" class="btn-success">Submit Assignment</button>
    <button id="enrollBtn" class="btn-info">Enroll Now</button>
    <button id="quizBtn" class="btn-warning">Start Quiz</button>
    <button id="gradesBtn" class="btn-secondary">View Grades</button>
    <button id="materialBtn" class="btn-info">Download Material</button>
    <button id="certificateBtn" class="btn-success">Download Certificate</button>
    <button id="discussBtn" class="btn-secondary">Join Discussion</button>
    <button id="scheduleBtn" class="btn-info">View Schedule</button>
    <button id="logoutBtn" class="btn-danger">Log Out</button>
    <button id="deleteAssignBtn" class="btn-danger">Delete Assignment</button>
    <button id="startQuizAltBtn" class="btn-warning">Begin Quiz</button>
</body>
</html>
