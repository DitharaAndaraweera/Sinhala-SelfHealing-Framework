<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><title>Government Page</title></head>
<body>
    <button id="loginBtn" class="btn-secondary">Sign In</button>
    <input type="text" id="nicInput" placeholder="National ID Number">
    <button id="submitBtn" class="btn-primary">Apply</button>
    <button id="downloadBtn" class="btn-info">Download Document</button>
    <button id="statusBtn" class="btn-secondary">Check Status</button>
    <button id="renewBtn" class="btn-warning">Renew License</button>
    <button id="fineBtn" class="btn-danger">Pay Fine</button>
    <button id="contactBtn" class="btn-secondary">Contact Us</button>
    <button id="uploadBtn" class="btn-info">Upload Documents</button>
    <button id="appointmentBtn" class="btn-primary">Reserve Appointment</button>
    <button id="complaintBtn" class="btn-warning">Submit Complaint</button>
    <button id="logoutBtn" class="btn-danger">Log Out</button>
    <button id="deleteDocBtn" class="btn-danger">Delete Document</button>
    <button id="renewAppBtn" class="btn-warning">Renew Appointment</button>
</body>
</html>
