<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><title>Healthcare Page</title></head>
<body>
    <button id="loginBtn" class="btn-secondary">Sign In</button>
    <input type="text" id="doctorSearch" placeholder="Doctor name">
    <button id="bookBtn" class="btn-primary">Book Appointment</button>
    <button id="cancelBtn" class="btn-danger">Cancel</button>
    <button id="symptomsBtn" class="btn-info">Submit Symptoms</button>
    <button id="reportsBtn" class="btn-secondary">View Reports</button>
    <button id="supportBtn" class="btn-warning">Contact Support</button>
    <button id="payBillBtn" class="btn-success">Pay Bill</button>
    <button id="prescriptionBtn" class="btn-info">View Prescription</button>
    <button id="rescheduleBtn" class="btn-secondary">Reschedule</button>
    <button id="feedbackBtn" class="btn-warning">Give Feedback</button>
    <button id="logoutBtn" class="btn-danger">Log Out</button>
</body>
</html>
