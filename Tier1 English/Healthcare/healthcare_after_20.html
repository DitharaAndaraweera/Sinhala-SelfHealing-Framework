<!DOCTYPE html>

<html lang="en">
<head><meta charset="utf-8"/><title>Healthcare Page</title></head>
<body>
<button class="btn-secondary" id="loginBtn">Sign In</button>
<input id="doctorSearch" placeholder="Doctor name" type="text"/>
<button class="btn-primary" id="bookBtn">Book Appointment</button>
<button class="btn-danger" id="cancelBtn">Cancel</button>
<button class="btn-info" id="symptomsBtn">Submit Symptoms</button>
<button class="btn-secondary" id="reportsBtn">View Reports</button>
<button class="btn-warning" id="supportBtn">Contact Support</button>
<button id="payBillBtn">Pay Invoice</button>
<button class="btn-info" id="prescriptionBtn">View Prescription</button>
<button class="btn-secondary" id="rescheduleBtn">Reschedule</button>
<button class="btn-warning" id="feedbackBtn">Give Feedback</button>
<button class="btn-danger" id="logoutBtn">Log Out</button>
</body>
</html>
