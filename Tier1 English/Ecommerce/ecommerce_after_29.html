<!DOCTYPE html>

<html lang="en">
<head><meta charset="utf-8"/><title>E-commerce Page</title></head>
<body>
<button class="btn-secondary" id="loginBtn">Sign In</button>
<input id="searchBox" placeholder="Search products" type="text"/>
<button class="btn-primary" id="cartBtn">Add to Cart</button>
<button class="btn-success" id="checkoutBtn">Buy Now</button>
<button class="btn-danger" id="removeBtn">Remove Item</button>
<button class="btn-info" id="trackBtn">Track Order</button>
<button class="btn-warning" id="couponBtn">Apply Coupon</button>
<button class="btn-secondary" id="continueBtn">Continue Shopping</button>
<button class="btn-info" id="wishlistBtn">Add to Wishlist</button>
<button class="btn-secondary" id="reviewBtn">Write a Review</button>
<button class="btn-warning" id="compareBtn">Compare</button>
<button class="btn-danger" id="logoutBtn">To Log Out</button>
</body>
</html>
