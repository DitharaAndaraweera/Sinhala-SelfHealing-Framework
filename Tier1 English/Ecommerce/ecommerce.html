<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><title>E-commerce Page</title></head>
<body>
    <button id="loginBtn" class="btn-secondary">Sign In</button>
    <input type="text" id="searchBox" placeholder="Search products">
    <button id="cartBtn" class="btn-primary">Add to Cart</button>
    <button id="checkoutBtn" class="btn-success">Buy Now</button>
    <button id="removeBtn" class="btn-danger">Remove Item</button>
    <button id="trackBtn" class="btn-info">Track Order</button>
    <button id="couponBtn" class="btn-warning">Apply Coupon</button>
    <button id="continueBtn" class="btn-secondary">Continue Shopping</button>
    <button id="wishlistBtn" class="btn-info">Add to Wishlist</button>
    <button id="reviewBtn" class="btn-secondary">Write a Review</button>
    <button id="compareBtn" class="btn-warning">Compare</button>
    <button id="logoutBtn" class="btn-danger">Log Out</button>
</body>
</html>
