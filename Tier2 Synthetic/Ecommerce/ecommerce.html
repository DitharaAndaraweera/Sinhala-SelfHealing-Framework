<!DOCTYPE html>
<html lang="si">
<head><meta charset="UTF-8"><title>E-commerce Page</title></head>
<body>
    <button id="loginBtn" class="btn-secondary">පිවිසෙන්න</button>
    <input type="text" id="searchBox" placeholder="භාණ්ඩ සොයන්න">
    <button id="cartBtn" class="btn-primary">කරත්තයට එකතු කරන්න</button>
    <button id="checkoutBtn" class="btn-success">මිලදී ගන්න</button>
    <button id="removeBtn" class="btn-danger">ඉවත් කරන්න</button>
    <button id="trackBtn" class="btn-info">ඇණවුම නිරීක්ෂණය කරන්න</button>
    <button id="couponBtn" class="btn-warning">කූපනය යොදන්න</button>
    <button id="continueBtn" class="btn-secondary">සාප්පු සවාරිය දිගටම කරගෙන යන්න</button>
    <button id="wishlistBtn" class="btn-info">කැමති ලැයිස්තුවට එකතු කරන්න</button>
    <button id="reviewBtn" class="btn-secondary">සමාලෝචනයක් ලියන්න</button>
    <button id="compareBtn" class="btn-warning">සංසන්දනය කරන්න</button>
    <button id="logoutBtn" class="btn-danger">පිටවෙන්න</button>
    <button id="cartDeleteBtn" class="btn-danger">කරත්තය මකන්න</button>
    <button id="removeWishBtn" class="btn-info">ලැයිස්තුවෙන් ඉවත් කරන්න</button>
</body>
</html>
