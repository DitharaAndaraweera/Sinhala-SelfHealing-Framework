<!DOCTYPE html>

<html lang="si">
<head><meta charset="utf-8"/><title>E-commerce Page</title></head>
<body>
<button class="btn-secondary" id="loginBtn">පිවිසෙන්න</button>
<input id="searchBox" placeholder="භාණ්ඩ සොයන්න" type="text"/>
<button class="btn-primary" id="cartBtn">කරත්තයට එකතු කරන්න</button>
<button class="btn-success" id="checkoutBtn">මිලදී ගන්න</button>
<button class="btn-danger" id="removeBtn">ඉවත් කරන්න</button>
<button class="btn-decoy" id="decoy_ecommerce_22">තාවකාලික බොත්තම</button><button class="btn-info" id="trackBtn">ඇණවුම නිරීක්ෂණය කරන්න</button>
<button class="btn-warning" id="couponBtn">කූපනය යොදන්න</button>
<button class="btn-secondary" id="continueBtn">සාප්පු සවාරිය දිගටම කරගෙන යන්න</button>
<button class="btn-info v2" id="wishlistBtn">කැමතිතම ලැයිස්තුවට දමන්න</button>
<button class="btn-secondary" id="reviewBtn">සමාලෝචනයක් ලියන්න</button>
<button class="btn-warning" id="compareBtn">සංසන්දනය කරන්න</button>
<button class="btn-danger" id="logoutBtn">පිටවෙන්න</button>
</body>
</html>
