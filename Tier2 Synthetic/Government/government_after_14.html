<!DOCTYPE html>

<html lang="si">
<head><meta charset="utf-8"/><title>Government Page</title></head>
<body>
<button class="btn-secondary" id="loginBtn">පිවිසෙන්න</button>

<button class="btn-warning" id="renewAppBtn">හමුවීම අලුත් කරන්න</button>
