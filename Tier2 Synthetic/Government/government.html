<!DOCTYPE html>
<html lang="si">
<head><meta charset="UTF-8"><title>Government Page</title></head>
<body>
    <button id="loginBtn" class="btn-secondary">පිවිසෙන්න</button>
    <input type="text" id="nicInput" placeholder="ජාතික හැඳුනුම්පත් අංකය">
    <button id="submitBtn" class="btn-primary">ඉල්ලුම් කරන්න</button>
    <button id="downloadBtn" class="btn-info">ලේඛනය බාගන්න</button>
    <button id="statusBtn" class="btn-secondary">තත්ත්වය පරීක්ෂා කරන්න</button>
    <button id="renewBtn" class="btn-warning">බලපත්‍රය අලුත් කරන්න</button>
    <button id="fineBtn" class="btn-danger">දඩය ගෙවන්න</button>
    <button id="contactBtn" class="btn-secondary">අප අමතන්න</button>
    <button id="uploadBtn" class="btn-info">ලේඛන උඩුගත කරන්න</button>
    <button id="appointmentBtn" class="btn-primary">හමුවීමක් වෙන් කරන්න</button>
    <button id="complaintBtn" class="btn-warning">පැමිණිල්ලක් ඉදිරිපත් කරන්න</button>
    <button id="logoutBtn" class="btn-danger">පිටවෙන්න</button>
    <button id="deleteDocBtn" class="btn-danger">ලේඛනය මකන්න</button>
    <button id="renewAppBtn" class="btn-warning">හමුවීම අලුත් කරන්න</button>
</body>
</html>
