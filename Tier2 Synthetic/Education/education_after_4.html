<!DOCTYPE html>

<html lang="si">
<head><meta charset="utf-8"/><title>Education Page</title></head>
<body>
<button class="btn-secondary v2" id="loginBtn">පිවිසෙනු ලැබේ</button>
<input id="courseInput" placeholder="පාඨමාලාව" type="text"/>
<button class="btn-primary" id="startBtn">පාඩම අරඹන්න</button>
<button class="btn-success" id="submitAssignBtn">පැවරුම ඉදිරිපත් කරන්න</button>
<button class="btn-decoy" id="decoy_education_4">තාවකාලික බොත්තම</button><button class="btn-info" id="enrollBtn">ලියාපදිංචි වන්න</button>
<button class="btn-warning" id="quizBtn">ප්‍රශ්නාවලිය ආරම්භ කරන්න</button>
<button class="btn-secondary" id="gradesBtn">ලකුණු බලන්න</button>
<button class="btn-info" id="materialBtn">ද්‍රව්‍ය බාගන්න</button>
<button class="btn-success" id="certificateBtn">සහතිකය බාගන්න</button>
<button class="btn-secondary" id="discussBtn">සාකච්ඡාවට එකතු වන්න</button>
<button class="btn-info" id="scheduleBtn">කාලසටහන බලන්න</button>
<button class="btn-danger" id="logoutBtn">පිටවෙන්න</button>
</body>
</html>
