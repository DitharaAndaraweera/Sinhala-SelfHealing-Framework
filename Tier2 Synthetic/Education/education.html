<!DOCTYPE html>
<html lang="si">
<head><meta charset="UTF-8"><title>Education Page</title></head>
<body>
    <button id="loginBtn" class="btn-secondary">පිවිසෙන්න</button>
    <input type="text" id="courseInput" placeholder="පාඨමාලාව">
    <button id="startBtn" class="btn-primary">පාඩම අරඹන්න</button>
    <button id="submitAssignBtn" class="btn-success">පැවරුම ඉදිරිපත් කරන්න</button>
    <button id="enrollBtn" class="btn-info">ලියාපදිංචි වන්න</button>
    <button id="quizBtn" class="btn-warning">ප්‍රශ්නාවලිය ආරම්භ කරන්න</button>
    <button id="gradesBtn" class="btn-secondary">ලකුණු බලන්න</button>
    <button id="materialBtn" class="btn-info">ද්‍රව්‍ය බාගන්න</button>
    <button id="certificateBtn" class="btn-success">සහතිකය බාගන්න</button>
    <button id="discussBtn" class="btn-secondary">සාකච්ඡාවට එකතු වන්න</button>
    <button id="scheduleBtn" class="btn-info">කාලසටහන බලන්න</button>
    <button id="logoutBtn" class="btn-danger">පිටවෙන්න</button>
    <button id="deleteAssignBtn" class="btn-danger">පැවරුම මකන්න</button>
    <button id="startQuizAltBtn" class="btn-warning">ප්‍රශ්නාවලිය අරඹන්න</button>
</body>
</html>
