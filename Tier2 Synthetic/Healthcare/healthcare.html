<!DOCTYPE html>
<html lang="si">
<head><meta charset="UTF-8"><title>Healthcare Page</title></head>
<body>
    <button id="loginBtn" class="btn-secondary">පිවිසෙන්න</button>
    <input type="text" id="doctorSearch" placeholder="වෛද්‍යවරයාගේ නම">
    <button id="bookBtn" class="btn-primary">වෙන් කරවා ගන්න</button>
    <button id="cancelBtn" class="btn-danger">අවලංගු කරන්න</button>
    <button id="symptomsBtn" class="btn-info">ලක්ෂණ ඉදිරිපත් කරන්න</button>
    <button id="reportsBtn" class="btn-secondary">වාර්තා බලන්න</button>
    <button id="supportBtn" class="btn-warning">සහාය අමතන්න</button>
    <button id="payBillBtn" class="btn-success">බිල ගෙවන්න</button>
    <button id="prescriptionBtn" class="btn-info">බෙහෙත් වට්ටෝරුව බලන්න</button>
    <button id="rescheduleBtn" class="btn-secondary">නැවත කාලසටහන් කරන්න</button>
    <button id="feedbackBtn" class="btn-warning">ප්‍රතිපෝෂණය ලබා දෙන්න</button>
    <button id="logoutBtn" class="btn-danger">පිටවෙන්න</button>
    <button id="cancelBookBtn" class="btn-danger">හමුවීම වෙන් කිරීම අවලංගු කරන්න</button>
    <button id="viewBillBtn" class="btn-secondary">බිල බලන්න</button>
</body>
</html>
