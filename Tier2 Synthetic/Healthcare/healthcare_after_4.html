<!DOCTYPE html>

<html lang="si">
<head><meta charset="utf-8"/><title>Healthcare Page</title></head>
<body>
<button class="btn-secondary" id="loginBtn">පිවිසෙන්න</button>
<input id="doctorSearch" placeholder="වෛද්‍යවරයාගේ නම" type="text"/><button class="btn-decoy" id="decoy_healthcare_4">තාවකාලික බොත්තම</button>
<button id="bookBtn">චැනල් කරන්න</button>
<button class="btn-danger" id="cancelBtn">අවලංගු කරන්න</button>
<button class="btn-info" id="symptomsBtn">ලක්ෂණ ඉදිරිපත් කරන්න</button>
<button class="btn-secondary" id="reportsBtn">වාර්තා බලන්න</button>
<button class="btn-warning" id="supportBtn">සහාය අමතන්න</button>
<button class="btn-success" id="payBillBtn">බිල ගෙවන්න</button>
<button class="btn-info" id="prescriptionBtn">බෙහෙත් වට්ටෝරුව බලන්න</button>
<button class="btn-secondary" id="rescheduleBtn">නැවත කාලසටහන් කරන්න</button>
<button class="btn-warning" id="feedbackBtn">ප්‍රතිපෝෂණය ලබා දෙන්න</button>
<button class="btn-danger" id="logoutBtn">පිටවෙන්න</button>
</body>
</html>
